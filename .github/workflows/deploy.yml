name: Build and Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.6'  # Match your Flutter version

    - name: Install dependencies
      run: flutter pub get

    - name: Build Web App
      run: flutter build web

    - name: Deploy to Server via SCP
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        source: "build/web/*"
        target: "/var/www/app.aidentify.app"
        strip_components: 2

    - name: Fix permissions and reload NGINX
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        script: |
          sudo chown -R www-data:www-data /var/www/app.aidentify.app
          sudo chmod -R 755 /var/www/app.aidentify.app
          sudo systemctl reload nginx
